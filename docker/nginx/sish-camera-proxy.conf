# Include this server/location configuration in the LAN-facing Nginx virtual host.
# Restrict access to the camera itself at the router/firewall so only this Nginx host
# can reach the ESP32-CAM upstream.
location = /_camera_authorize {
    internal;
    proxy_pass http://127.0.0.1:8000/camera/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location = /camera/stream {
    auth_request /_camera_authorize;
    proxy_pass http://192.168.1.60:81/stream;
    proxy_set_header X-Camera-Token "REPLACE_WITH_CAMERA_PROXY_TOKEN";
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    add_header Cache-Control "no-store" always;
}

location = /camera/health {
    auth_request /_camera_authorize;
    proxy_pass http://192.168.1.60:80/;
    proxy_set_header X-Camera-Token "REPLACE_WITH_CAMERA_PROXY_TOKEN";
    proxy_read_timeout 3s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

location = /camera/ {
    auth_request /_camera_authorize;
    proxy_pass http://192.168.1.60:80/;
    proxy_set_header X-Camera-Token "REPLACE_WITH_CAMERA_PROXY_TOKEN";
}
