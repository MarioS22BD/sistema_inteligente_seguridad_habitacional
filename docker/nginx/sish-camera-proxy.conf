# Include this server/location configuration in the LAN-facing Nginx virtual host.
# Restrict access to the camera itself at the router/firewall so only this Nginx host
# can reach the ESP32-CAM upstream.
location = /_camera_authorize {
    internal;
    proxy_pass http://127.0.0.1:8000/camera/authorize;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $http_host;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
}

location = /camera/stream {
    auth_request /_camera_authorize;
    proxy_pass http://192.168.137.28:81/stream;
    proxy_set_header X-Camera-Token "sish-camera-live-2026-secret-9f2e";
    proxy_http_version 1.1;
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_read_timeout 1h;
    proxy_send_timeout 1h;
    proxy_set_header Connection "";
    add_header Cache-Control "no-store" always;
}

location = /camera/health {
    auth_request /_camera_authorize;
    proxy_pass http://192.168.137.28:80/;
    proxy_set_header X-Camera-Token "sish-camera-live-2026-secret-9f2e";
    proxy_read_timeout 3s;
    proxy_buffering off;
    add_header Cache-Control "no-store" always;
}

location = /camera/ {
    auth_request /_camera_authorize;
    proxy_pass http://192.168.137.28:80/;
    proxy_set_header X-Camera-Token "sish-camera-live-2026-secret-9f2e";
}

location / {
    proxy_pass http://127.0.0.1:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
}
