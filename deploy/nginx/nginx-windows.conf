# Configuración completa de Nginx para Windows en SISH
# Permite servir el Dashboard y proteger el stream MJPEG de la ESP32-CAM
# sin bloquear los procesos de PHP en desarrollo local.
#
# Instrucciones de uso en Windows:
# 1. Descargue Nginx para Windows desde: http://nginx.org/en/download.html
# 2. Descomprima Nginx (p. ej. en C:\nginx).
# 3. Ajuste la IP de la ESP32-CAM (por defecto 192.168.1.60) y el token si corresponde.
# 4. Inicie Nginx desde PowerShell:
#      cd C:\nginx
#      .\nginx.exe -c c:\laravel\sistema_inteligente_seguridad_habitacional\deploy\nginx\nginx-windows.conf
# 5. Abra http://localhost:8080 en el navegador.

worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile      on;
    keepalive_timeout 65;

    server {
        listen       8080;
        server_name  localhost;

        # Subsolicitud interna de autorización de cámara hacia Laravel
        location = /_camera_authorize {
            internal;
            proxy_pass http://127.0.0.1:8000/camera/authorize;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Cookie $http_cookie;
            proxy_set_header X-Forwarded-For $remote_addr;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Stream MJPEG continuo protegido hacia el puerto 81 de la ESP32-CAM
        location = /camera/stream {
            auth_request /_camera_authorize;
            proxy_pass http://192.168.1.60:81/stream;
            proxy_set_header X-Camera-Token "REPLACE_WITH_CAMERA_PROXY_TOKEN";
            proxy_http_version 1.1;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 1h;
            proxy_send_timeout 1h;
            add_header Cache-Control "no-store" always;
        }

        # Comprobación de salud / estado de la ESP32-CAM
        location = /camera/health {
            auth_request /_camera_authorize;
            proxy_pass http://192.168.1.60:80/;
            proxy_set_header X-Camera-Token "REPLACE_WITH_CAMERA_PROXY_TOKEN";
            proxy_read_timeout 3s;
            proxy_buffering off;
            add_header Cache-Control "no-store" always;
        }

        # Todo el tráfico restante se reenvía a Laravel (php artisan serve en puerto 8000)
        location / {
            proxy_pass http://127.0.0.1:8000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}
